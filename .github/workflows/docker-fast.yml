name: Build Fast Docker Image (Go & Svelte PWA)

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'Dockerfile.custom'
      - '.github/workflows/docker-fast.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Fast Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set repo name to lowercase
        run: |
          echo "LOWER_REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "LOWER_REPO_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.custom
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.LOWER_REPO_OWNER }}/${{ env.LOWER_REPO_NAME }}:latest
            ghcr.io/${{ env.LOWER_REPO_OWNER }}/${{ env.LOWER_REPO_NAME }}:nextgen
            ghcr.io/${{ env.LOWER_REPO_OWNER }}/${{ env.LOWER_REPO_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

