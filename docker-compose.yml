---
services:
  calibre-web-automated:
    image: ghcr.io/goldbull3t/calibre-web-automated:latest
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - HARDCOVER_TOKEN=your_hardcover_api_key_here
      - NETWORK_SHARE_MODE=false
    volumes:
      - /path/to/config/folder:/config
      # Ingest de livros: detetado automaticamente pelo motor Go
      - /path/to/the/folder/you/want/to/use/for/book/ingest:/cwa-book-ingest
      # Quarentena de livros corrompidos/ambíguos:
      - /path/to/cwa-quarantine:/cwa-quarantine
      # Biblioteca Calibre: detetada automaticamente pelo motor Go
      - /path/to/your/calibre/library:/calibre-library
      - /path/to/your/calibre/plugins/folder:/config/.config/calibre/plugins
    ports:
      - 8083:8083
    restart: unless-stopped
